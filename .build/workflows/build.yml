name: Build Waveshare Ghost Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "platformio.ini"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Waveshare ESP32-S3 firmware
        run: pio run -e waveshare-s3-can

      - name: Collect OTA firmware
        run: |
          mkdir -p out
          cp .pio/build/waveshare-s3-can/firmware.bin out/ghost-waveshare-s3-can.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-waveshare-s3-can
          path: out/ghost-waveshare-s3-can.bin
          if-no-files-found: error
